name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests
        run: ./gradlew :core:model:test
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Screenshot goldens
        run: ./gradlew verifyScreenshots
      - name: Static analysis and lint
        run: ./gradlew detekt lint
      - name: Texts come from string resources
        run: |
          sh scripts/test-check-no-literals.sh
          sh scripts/check-no-literals.sh
