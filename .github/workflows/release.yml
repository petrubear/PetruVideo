name: Release

# A tag vX.Y.Z publishes a GitHub release with the signed APK and the CHANGELOG notes of that version.
# Start it by hand (Actions, Release, Run workflow) to publish a tag that already exists.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v0.5.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag name
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check the tag exists
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG was not found in $GITHUB_REPOSITORY"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check the tag matches the app version
        run: |
          app=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          if [ "$app" != "$VERSION" ]; then
            echo "::error::Tag $TAG is version $VERSION but app/build.gradle.kts says $app"; exit 1
          fi

      - name: Read the release notes from the CHANGELOG
        run: |
          if ! sh scripts/changelog-notes.sh "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md" 2> "$RUNNER_TEMP/notes.err"; then
            echo "::error::$(cat "$RUNNER_TEMP/notes.err")"; exit 1
          fi

      - name: Check the signing key settings
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See 'Releasing' in the README."; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:model:test testDebugUnitTest

      - name: Build the signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the signature and name the file
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          # find can exit non-zero on a folder it cannot read, which would end this step under the shell's strict mode
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found under $sdk/build-tools"; exit 1
          fi
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" > signature.txt || { cat signature.txt; echo "::error::the APK signature did not verify"; exit 1; }
          cat signature.txt
          mkdir -p dist
          cp "$apk" "dist/PetruVideo-$VERSION.apk"
          (cd dist && sha256sum "PetruVideo-$VERSION.apk" > "PetruVideo-$VERSION.apk.sha256")
          cat "dist/PetruVideo-$VERSION.apk.sha256"

      - name: Create or update the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "dist/PetruVideo-$VERSION.apk" "dist/PetruVideo-$VERSION.apk.sha256" --clobber
          else
            gh release create "$TAG" "dist/PetruVideo-$VERSION.apk" "dist/PetruVideo-$VERSION.apk.sha256" \
              --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
